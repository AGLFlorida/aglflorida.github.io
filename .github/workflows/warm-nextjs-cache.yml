# Github now issues a read-only cache token to workflows triggered by workflow_run
# (see https://github.blog/changelog/2026-06-26-read-only-actions-cache-for-untrusted-triggers/),
# which is how nextjs.yml's deploy build runs. That build can restore a cache but can
# never save one. This workflow sits between Tag and Release and the deploy build
# (tag -> warm-cache -> nextjs, see nextjs.yml's trigger), so the deploy build
# literally cannot start until this one finishes saving the cache under the identical
# key scheme nextjs.yml reads from via restore-keys.
name: Warm Next.js Build Cache

on:
  workflow_run:
    workflows: ['Tag and Release']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: warm-nextjs-cache
  cancel-in-progress: true

jobs:
  warm-cache:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Restore and save cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        env:
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
