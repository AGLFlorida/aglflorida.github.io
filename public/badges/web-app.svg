<svg xmlns="http://www.w3.org/2000/svg" width="110" height="40" viewBox="0 0 110 40">
  <title>Open in your Browser</title>
  <!-- Drawn to sit beside the official App Store and Google Play badges: same 3:1 black badge,
       gray hairline border and rounded corners, icon on the left, small caption over a large name. -->
  <rect x="0.5" y="0.5" width="109" height="39" rx="6.5" fill="#000" stroke="#a6a6a6" />
  <g fill="none" stroke="#fff" stroke-width="1.4">
    <circle cx="19" cy="20" r="10" />
    <ellipse cx="19" cy="20" rx="4.2" ry="10" />
    <path d="M9 20h20M10.5 14.8h17M10.5 25.2h17" />
  </g>
  <g fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="36.5" y="15.5" font-size="9">Open in your</text>
    <text x="35.5" y="31.5" font-size="18" font-weight="500" letter-spacing="-0.4">Browser</text>
  </g>
</svg>
